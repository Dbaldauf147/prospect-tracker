<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter loads without blocking the first paint. A plain stylesheet link
         holds rendering until it resolves, so any hiccup reaching
         fonts.googleapis.com (VPN, corporate proxy, blocker, flaky wifi) left
         the app on a white screen — measured at 15s when the host didn't
         answer, with the app's own JS ready in under 200ms. Fetching it as
         `print` media takes it off the critical path; onload flips it to
         `all` and the text re-renders in Inter a moment later. No <noscript>
         fallback: this is a React SPA, so a scripting-disabled browser has
         nothing to render the font onto. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'; this.onload=null;"
    />
    <title>Prospect Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- The in-app error boundary catches anything that throws while React is
         rendering. It cannot catch a module that throws while it is still
         being evaluated: that happens before the boundary exists, kills the
         entry chunk, and leaves #root empty. Every white screen this app has
         had looked identical from the outside -- nothing on the page, and
         nothing for the person looking at it to report. This is the net under
         that case, and it only ever draws on an empty #root, so a mounted app
         is never touched. -->
    <script>
      (function () {
        var drawn = false;
        function report(message, stack) {
          if (drawn) return;
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return; // app is up, leave it be
          drawn = true;
          root.innerHTML = '';

          var wrap = document.createElement('div');
          wrap.style.cssText = 'max-width:720px;margin:3rem auto;padding:1.5rem;font-family:Inter,system-ui,sans-serif;color:#0F172A';

          var h = document.createElement('h1');
          h.style.cssText = 'font-size:1.15rem;margin:0 0 .5rem';
          h.textContent = 'The app failed to start';
          wrap.appendChild(h);

          var p = document.createElement('p');
          p.style.cssText = 'color:#475569;font-size:13px;line-height:1.5';
          p.textContent = 'Something threw while the page was loading, so nothing could render. Your data is untouched. The error is below -- send it on if it keeps happening.';
          wrap.appendChild(p);

          var pre = document.createElement('pre');
          pre.style.cssText = 'background:#F8FAFC;border:1px solid #E2E8F0;border-radius:6px;padding:.75rem;font-size:12px;overflow-x:auto;white-space:pre-wrap';
          // A stack normally repeats its own message on the first line, and
          // the window event prefixes the same text with "Uncaught". Printing
          // both says everything twice, so prefer the stack when it already
          // carries the message.
          var body = message;
          if (stack) body = stack.indexOf(message.replace(/^Uncaught\s+/, '')) !== -1 ? stack : message + '\n\n' + stack;
          pre.textContent = body;
          wrap.appendChild(pre);

          var bar = document.createElement('div');
          bar.style.cssText = 'display:flex;gap:.5rem;margin-top:.75rem';
          var reload = document.createElement('button');
          reload.type = 'button';
          reload.style.cssText = 'padding:.45rem .9rem;border:1px solid #CBD5E1;border-radius:6px;background:#fff;font-size:13px;cursor:pointer;font-family:inherit';
          reload.textContent = 'Reload';
          reload.onclick = function () { window.location.reload(); };
          bar.appendChild(reload);
          wrap.appendChild(bar);

          root.appendChild(wrap);
        }

        window.addEventListener('error', function (e) {
          // A failed stylesheet/image/script fetch also fires here, with the
          // element as the target and no Error attached. Those are not what
          // blanks the page, and reporting them would bury the real cause.
          if (e.target && e.target !== window) return;
          if (!e.error && !e.message) return;
          report(e.message || String(e.error), e.error && e.error.stack);
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason;
          if (!r) return;
          report(String((r && r.message) || r), r && r.stack);
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
