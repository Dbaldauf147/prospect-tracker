# NOT ACTIVE YET — this file has to move to .github/workflows/ to run.
#
#   git mv .github/workflows-pending/firestore-rules.yml .github/workflows/
#
# It lives here because creating anything under .github/workflows/ requires
# a GitHub token with the `workflow` scope, which the assistant that wrote
# this doesn't have; the move is a one-liner for a human who does. Delete
# the workflows-pending directory once it's moved.
#
# ---------------------------------------------------------------------------
# Keeps the deployed Firestore security rules in step with the ones in git.
#
# Why this exists: `firestore.rules` is the only part of the app that isn't
# shipped by the Vercel build. Before this workflow it was a manual
# `firebase deploy` someone had to remember after merging, and forgetting
# it fails silently — the client catches permission errors and degrades
# (e.g. the Call Recordings page just stops persisting transcripts) rather
# than surfacing anything. Git is now the source of truth.
#
# Two halves:
#   * pull_request → validate only. A rules file that doesn't compile can't
#     reach master.
#   * push to master → validate, then release.
#
# Both only run when the rules (or the firebase config that points at them)
# actually change, so ordinary PRs don't pay for a Firebase round trip.

name: Firestore rules

on:
  push:
    branches: [master]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firestore-rules.yml'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firestore-rules.yml'
  # Manual run, for redeploying the current rules without touching the file
  # (e.g. after someone edited rules in the Firebase Console and you want
  # git's version to win again).
  workflow_dispatch:

# Rules are a single global resource: two releases racing would leave
# whichever finished last in place, regardless of which commit was newer.
concurrency:
  group: firestore-rules
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rules:
    name: ${{ github.event_name == 'pull_request' && 'Validate' || 'Deploy' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Pinned to a major so a firebase-tools release can't change deploy
      # behaviour without a deliberate bump here.
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15

      # A missing secret otherwise surfaces as an opaque
      # "Failed to authenticate, have you run firebase login?" further down.
      - name: Check credentials are configured
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is not set. Add a Firebase service-account JSON key with the 'Firebase Rules Admin' role under Settings → Secrets and variables → Actions."
            exit 1
          fi

      # Written to the runner's temp dir (wiped with the runner) rather than
      # the workspace, so it can't be picked up by a later step that globs
      # the checkout or end up in an artifact.
      - name: Authenticate
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      # Compiles the ruleset and reports what would change without releasing
      # it. On a PR this is the whole job.
      - name: Validate rules
        run: |
          firebase deploy \
            --only firestore:rules \
            --project tracker-3161a \
            --non-interactive \
            --dry-run

      - name: Deploy rules
        if: github.event_name != 'pull_request'
        run: |
          firebase deploy \
            --only firestore:rules \
            --project tracker-3161a \
            --non-interactive \
            --message "${GITHUB_SHA::7} via GitHub Actions"

      # Cheap insurance: the credential is gone even if a future step is
      # added below this one.
      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
